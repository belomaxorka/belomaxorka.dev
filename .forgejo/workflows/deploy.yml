name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

# The actions are pinned to a commit, by their full address in Forgejo's registry (where the runner takes them
# anyway): a tag like v4 can be moved to other code, and the deploy job holds the server's key. The comment after
# the hash is the release it is; Renovate (.renovaterc.json) opens a PR when there is a newer one.
jobs:
  # Every page of this commit must render with site-api's main (site-api -check), or the server would refuse the
  # new templates.
  check:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site

      # The theme is one switch in tokens.css; no other stylesheet asks for it, and the switch's sides agree.
      - name: One theme switch
        run: node site/tools/check-themes.mjs site/assets/css

      # A unit that shows live data must say how it gets it (data-net, data-host, data-role).
      - name: Every unit is declared
        run: node site/tools/check-units.mjs site/templates

      - name: Get site-api
        run: git clone --depth 1 "$GITHUB_SERVER_URL/belomaxorka/site-api.git" site-api

      # The Go of site-api's toolchain line: it sits in the runner's tool cache, so setup-go does not download it.
      - id: go
        run: echo "version=$(sed -n 's/^toolchain go//p' site-api/go.mod)" >> "$GITHUB_OUTPUT"

      - uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.go.outputs.version }}

      - name: Every page renders
        working-directory: site-api
        run: go run ./cmd/site-api -check -site "$GITHUB_WORKSPACE/site"

  deploy:
    needs: check
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pack site
        run: git archive --format=tar -o site.tar HEAD -- . ':(exclude,glob).*' ':(exclude,glob).*/**' ':(exclude)README.md' ':(exclude)tools'

      - name: Ship to server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_TARGET" "site $GITHUB_SHA" < site.tar
